name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest"

      - name: Fix live charge estimate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/votoljk/unified/MainActivity.kt")
          s = p.read_text()
          old = "val hours = data.fullAh / amps"
          new = "val chargeAh = (data.fullAh - data.remainingAh).coerceAtLeast(0f)\n            val hours = chargeAh / amps"
          if old in s:
              p.write_text(s.replace(old, new, 1))
              print("CHARGE ESTIMATE FORMULA FIXED")
          elif "val chargeAh = (data.fullAh - data.remainingAh).coerceAtLeast(0f)" in s:
              print("CHARGE ESTIMATE FORMULA ALREADY FIXED")
          else:
              raise SystemExit("Charge estimate formula not found")
          PY

      - name: Add VOTOL SPP RX diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/votoljk/unified/MainActivity.kt")
          s = p.read_text()
          old = '''    private fun readClassic(input: InputStream) {
          val buf = ByteArray(1024)
          while (votolSocket?.isConnected == true) {
              val n = runCatching { input.read(buf) }.getOrDefault(-1); if (n <= 0) break
              val hex = buf.copyOf(n).joinToString(" ") { String.format("%02X", it) }
              runOnUiThread { log.text = "VOTOL RX ${n}B  $hex" }
          }
      }'''
          new = '''    private fun readClassic(input: InputStream) {
          val buf = ByteArray(1024)
          var packet = 0L
          runOnUiThread { log.append("\\nVOTOL RX STREAM START\\n") }
          try {
              while (votolSocket?.isConnected == true) {
                  val n = input.read(buf)
                  if (n < 0) {
                      runOnUiThread { log.append("\\nVOTOL RX EOF\\n") }
                      break
                  }
                  if (n == 0) continue
                  packet++
                  val hex = buf.copyOf(n).joinToString(" ") { String.format("%02X", it.toInt() and 0xFF) }
                  runOnUiThread { log.append("\\nVOTOL RX #$packet ${n}B  $hex\\n") }
              }
          } catch (e: Exception) {
              runOnUiThread { log.append("\\nVOTOL RX ERROR: ${e.javaClass.simpleName}: ${e.message}\\n") }
          } finally {
              runOnUiThread { log.append("\\nVOTOL RX STREAM END\\n") }
          }
      }'''
          if old not in s:
              raise SystemExit("readClassic block not found")
          p.write_text(s.replace(old, new, 1))
          print("VOTOL SPP RX DIAGNOSTICS ADDED")
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VotolJKUnified-APK
          path: app/build/outputs/apk/debug/app-debug.apk
