name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest"

      - name: Patch charge estimate
        run: python3 -c "from pathlib import Path;p=Path('app/src/main/java/com/votoljk/unified/MainActivity.kt');s=p.read_text();old='val hours = data.fullAh / amps';new='val chargeAh = (data.fullAh - data.remainingAh).coerceAtLeast(0f)\\n            val hours = chargeAh / amps';p.write_text(s.replace(old,new,1) if old in s else s);print('CHARGE ESTIMATE OK')"

      - name: Patch VOTOL diagnostics
        run: python3 -c "import base64,re;from pathlib import Path;p=Path('app/src/main/java/com/votoljk/unified/MainActivity.kt');s=p.read_text();co=base64.b64decode(''.replace('\\n','\n').encode()).decode();ro=base64.b64decode(''.encode()).decode();rn=base64.b64decode(''.encode()).decode();assert 'readClassic(s.inputStream())' in s;assert 'private fun readClassic(input: InputStream)' in s;s=s.replace('readClassic(s.inputStream())',co,1);s=re.sub(r'private fun readClassic\\(input: InputStream\\) \\{.*?^    \\}',rn,s,count=1,flags=re.S|re.M);p.write_text(s);print('VOTOL DIAGNOSTICS PATCHED')"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VotolJKUnified-APK
          path: app/build/outputs/apk/debug/app-debug.apk
