name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest"
      - name: Patch VOTOL dashboard
        run: python3 scripts/patch_votol_dashboard.py
      - name: Add floating REPORT
        run: python3 scripts/patch_report_button.py
      - name: Fix live charge estimate
        run: python3 -c 'from pathlib import Path; p=Path("app/src/main/java/com/votoljk/unified/MainActivity.kt"); s=p.read_text(); old="val hours = data.fullAh / amps"; new="val chargeAh = (data.fullAh - data.remainingAh).coerceAtLeast(0f)\n            val hours = chargeAh / amps"; p.write_text(s.replace(old,new,1) if old in s else s)'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VotolJKUnified-APK
          path: app/build/outputs/apk/debug/app-debug.apk
