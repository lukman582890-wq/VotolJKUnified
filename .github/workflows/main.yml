name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest"

      - name: Fix live charge estimate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/votoljk/unified/MainActivity.kt")
          s = p.read_text()
          old = "val hours = data.fullAh / amps"
          new = "val chargeAh = (data.fullAh - data.remainingAh).coerceAtLeast(0f)\n            val hours = chargeAh / amps"
          if old in s:
              p.write_text(s.replace(old, new, 1))
              print("CHARGE ESTIMATE FORMULA FIXED")
          elif "val chargeAh = (data.fullAh - data.remainingAh).coerceAtLeast(0f)" in s:
              print("CHARGE ESTIMATE FORMULA ALREADY FIXED")
          else:
              raise SystemExit("Charge estimate formula not found")
          PY

      - name: Add VOTOL live query diagnostics
        run: python3 -c "import base64;from pathlib import Path;p=Path('app/src/main/java/com/votoljk/unified/MainActivity.kt');s=p.read_text();oc=base64.b64decode(''.encode()).decode();nc=base64.b64decode(''.encode()).decode();orr=base64.b64decode(''.encode()).decode();assert oc in s,'connect block not found';assert orr in s,'read block not found';s=s.replace(oc,nc,1).replace(orr,nrr,1);p.write_text(s);print('VOTOL LIVE QUERY ADDED')"

      - name: Fix VOTOL query build compatibility
        run: python3 -c "from pathlib import Path;p=Path('app/src/main/java/com/votoljk/unified/MainActivity.kt');s=p.read_text();s=s.replace('varpacket = 0L','var packet = 0L',1);s=s.replace('                            break\n                        }\n                        Thread.sleep(1000)','                        }\n                        Thread.sleep(1000)',1);p.write_text(s);print('VOTOL QUERY PATCH NORMALIZED')"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VotolJKUnified-APK
          path: app/build/outputs/apk/debug/app-debug.apk
