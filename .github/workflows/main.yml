name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest"

      - name: Fix live charge estimate
        run: python3 -c 'from pathlib import Path; p=Path("app/src/main/java/com/votoljk/unified/MainActivity.kt"); s=p.read_text(); old="val hours = data.fullAh / amps"; new="val chargeAh = (data.fullAh - data.remainingAh).coerceAtLeast(0f)\n            val hours = chargeAh / amps"; p.write_text(s.replace(old,new,1) if old in s else s)'

      - name: Add VOTOL SHOW telemetry polling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/votoljk/unified/MainActivity.kt")
          s = p.read_text()
          old = '''    private fun connectVotol(d: BluetoothDevice) {
          Thread {
              runCatching {
                  adapter.cancelDiscovery(); runOnUiThread { votolStatus.text = "CONNECTING…" }
                  val s = d.createRfcommSocketToServiceRecord(SPP_UUID); s.connect(); votolSocket = s
                  runOnUiThread { votolStatus.text = "CONNECTED"; votolStatus.setTextColor(0xFF45D6A3.toInt()); log.text = "VOTOL SPP connected: ${d.name ?: d.address}." }
                  readClassic(s.inputStream)
              }.onFailure { e -> runOnUiThread { votolStatus.text = "ERROR"; log.text = "VOTOL: ${e.message}" } }
          }.start()
      }

      private fun readClassic(input: InputStream) {
          val buf = ByteArray(1024)
          while (votolSocket?.isConnected == true) {
              val n = runCatching { input.read(buf) }.getOrDefault(-1); if (n <= 0) break
              val hex = buf.copyOf(n).joinToString(" ") { String.format("%02X", it) }
              runOnUiThread { log.text = "VOTOL RX ${n}B  $hex" }
          }
      }
'''
          new = '''    private val votolPollHandler = Handler(Looper.getMainLooper())

      private fun connectVotol(d: BluetoothDevice) {
          Thread {
              runCatching {
                  adapter.cancelDiscovery(); runOnUiThread { votolStatus.text = "CONNECTING…" }
                  val s = d.createRfcommSocketToServiceRecord(SPP_UUID); s.connect(); votolSocket = s
                  runOnUiThread { votolStatus.text = "CONNECTED"; votolStatus.setTextColor(0xFF45D6A3.toInt()); log.text = "VOTOL SPP connected: ${d.name ?: d.address}. SHOW polling active." }
                  startVotolPolling(s)
                  readClassic(s.inputStream)
              }.onFailure { e -> runOnUiThread { votolStatus.text = "ERROR"; log.text = "VOTOL: ${e.message}" } }
          }.start()
      }

      private fun createVotolShowPacket(): ByteArray {
          val p = ByteArray(24)
          p[0] = 0xC9.toByte(); p[1] = 0x14.toByte(); p[2] = 0x0D.toByte()
          p[3] = 'S'.code.toByte(); p[4] = 'H'.code.toByte(); p[5] = 'O'.code.toByte(); p[6] = 'W'.code.toByte()
          var xor = 0
          for (i in 0..21) xor = xor xor (p[i].toInt() and 0xFF)
          p[22] = xor.toByte(); p[23] = 0x0D.toByte()
          return p
      }

      private fun startVotolPolling(socket: BluetoothSocket) {
          votolPollHandler.removeCallbacksAndMessages(null)
          val poll = object : Runnable {
              override fun run() {
                  if (votolSocket === socket && socket.isConnected) {
                      runCatching {
                          val packet = createVotolShowPacket()
                          socket.outputStream.write(packet); socket.outputStream.flush()
                          val hex = packet.joinToString(" ") { String.format("%02X", it) }
                          runOnUiThread { log.append("\\nVOTOL TX ${packet.size}B  $hex") }
                      }.onFailure { e -> runOnUiThread { log.append("\\nVOTOL TX ERROR: ${e.message}") } }
                      votolPollHandler.postDelayed(this, 700)
                  }
              }
          }
          votolPollHandler.post(poll)
      }

      private fun readClassic(input: InputStream) {
          val buf = ByteArray(1024)
          while (votolSocket?.isConnected == true) {
              val n = runCatching { input.read(buf) }.getOrDefault(-1); if (n <= 0) break
              val data = buf.copyOf(n)
              val hex = data.joinToString(" ") { String.format("%02X", it) }
              runOnUiThread { log.append("\\nVOTOL RX ${n}B  $hex") }
          }
      }
'''
          if old not in s:
              raise SystemExit("VOTOL connect/read block not found")
          p.write_text(s.replace(old, new, 1))
          print("VOTOL SHOW POLLING PATCHED")
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VotolJKUnified-APK
          path: app/build/outputs/apk/debug/app-debug.apk
